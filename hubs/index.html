(:last-child)::after{content:"→";position:absolute;right:-10px;top:34px;color:#236B63;font-weight:900}.ico{font-size:24px}.node b{display:block;font-size:12px;color:#123a35;margin-top:3px}.node small{display:block;font-size:10.5px;color:#49645f;margin-top:4px;line-height:1.35}.mapWrap{border:1px solid #c7e2dc;border-radius:18px;overflow:hidden;background:#e9f6f3}.mapWrap img{display:block;width:100%;height:auto;background:#e9f6f3}.caption{padding:10px 12px;font-size:12px;line-height:1.5;color:#385550;background:#fbfffd}.infoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.info{border:1px solid #c7e2dc;background:#fbfffd;border-radius:14px;padding:11px}.info b{font-size:13px;color:#123a35}.info p{font-size:12px;line-height:1.45;margin:5px 0 0;color:#4d665f}.timeline{display:flex;gap:8px;overflow-x:auto;padding:2px 0}.t{flex:0 0 118px;border:1px solid #c7e2dc;background:#fbfffd;border-radius:14px;padding:10px;text-align:center}.t strong{display:block;color:#236B63;font-size:13px}.t span{display:block;margin-top:5px;font-size:11.5px;line-height:1.35;font-weight:800}.t.active{background:linear-gradient(135deg,#236B63,#164f49);color:#fff;border-color:#57BFB6}.t.active strong,.t.active span{color:#fff}.note{background:linear-gradient(135deg,#effffb,#dff5ef);border:1px solid #9fc7c0;border-radius:16px;padding:13px;font-size:13px;line-height:1.6;font-weight:700;color:#16332f}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.action{display:block;text-align:center;text-decoration:none;border-radius:13px;padding:12px;font-size:13px;font-weight:900}.primary{background:#236B63;color:#fff}.secondary{background:#fff;border:1px solid #9fc7c0;color:#123a35}.placeholder{padding:24px 14px;text-align:center}.placeholder h2{margin:0 0 8px;font-size:22px;color:#123a35}.placeholder p{margin:0;color:#4d665f;line-height:1.55}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;z-index:1000;padding:18px}.drawer.show{display:flex}.drawerCard{width:min(430px,100%);background:#fbfffd;border:1px solid #9fc7c0;border-radius:18px;padding:15px;box-shadow:0 10px 30px rgba(0,0,0,.24)}.drawerHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.drawerHead b{font-size:18px;color:#123a35}.drawerClose{border:0;background:#236B63;color:white;border-radius:10px;padding:8px 10px;font-weight:900}.hubList{display:grid;gap:8px}.hubItem{display:block;text-decoration:none;border:1px solid #c7e2dc;background:#fff;border-radius:14px;padding:12px;color:#123a35}.hubItem b{display:block;font-size:14px}.hubItem span{display:block;margin-top:4px;font-size:12px;color:#536e68;line-height:1.35}.hubItem.active{background:linear-gradient(135deg,#236B63,#164f49);color:#fff;border-color:#57BFB6}.hubItem.active span{color:#e6fff9}@media(max-width:560px){.summaryGrid,.infoGrid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.node:nth-child(2)::after{display:none}.top h1{font-size:24px}.pill{margin-left:0}.actions{grid-template-columns:1fr}}

    info:[['회복의 주도권','귀환은 유다 백성의 힘이 아니라 하나님의 섭리와 약속 성취로 시작됩니다.'],['이방 왕 고레스','하나님은 바사 왕 고레스를 사용하여 포로귀환의 문을 여십니다.'],['스룹바벨 공동체','1차 귀환 공동체는 성전 재건과 예배 회복의 기초를 놓습니다.'],['CEN 연결','Check: 무슨 일이 일어났는가 · Explore: 왜 이방 왕을 사용하셨는가 · Note: 회복은 하나님의 약속에서 시작된다.']],

    note:'성전 허브의 핵심은 “건물 재건”이 아니라 “예배 회복”입니다. 무너진 성전은 낙심으로 멈췄지만, 하나님의 말씀으로 다시 세워졌습니다.',
    prev:'return',next:'esther',prevLabel:'← 이전 허브: 귀환',nextLabel:'다음 허브: 보존 →'

    subtitle:'에스더 사건을 중심으로 보이지 않는 하나님의 섭리가 언약 백성을 보존하는 흐름을 탐험합니다.',
    summary:[['대표사건','에스더와 유대 민족 보존'],['연대','BC 478경'],['대표인물','에스더 · 모르드개 · 하만 · 아하수에로'],['관련성경','에스더 1~10장']],

const params=new URLSearchParams(location.search);let slug=params.get('hub')||'return';if(!HUBS[slug])slug='return';
function esc(s){return String(s??'')}
function renderTabs(){document.getElementById('tabs').innerHTML=Object.entries(HUBS).map(([k,h])=>`<a class="tab ${k===slug?'active':''}" href="?hub=${k}">${h.label}</a>`).join('')}
function renderHeader(h){document.getElementById('kicker').textContent=h.order;document.getElementById('title').textContent=h.title;document.getElementById('subtitle').textContent=h.subtitle}
function renderHub(h){return `<section class="card"><h2 class="sectionTitle">핵심 요약</h2><div class="summaryGrid">${h.summary.map(x=>`<div class="mini"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></section>
<section class="card"><h2 class="sectionTitle">${h.label} 흐름</h2><div class="flow">${h.flow.map(x=>`<div class="node"><div class="ico">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div></section>
<section class="card"><h2 class="sectionTitle">${h.mapTitle}</h2><div class="mapWrap"><img src="${h.map}" alt="${h.mapTitle}"><div class="caption">${h.mapCaption}</div></div></section>
<section class="card"><h2 class="sectionTitle">핵심 의미</h2><div class="infoGrid">${h.info.map(x=>`<div class="info"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div></section>
<section class="card"><h2 class="sectionTitle">연대 흐름</h2><div class="timeline">${h.timeline.map(x=>`<div class="t ${x[2]?'active':''}"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div></section>
<div class="note">${h.note}</div>
<div class="actions">${h.prev?`<a class="action secondary" href="?hub=${h.prev}">${h.prevLabel}</a>`:`<a class="action secondary" href="../index.html">← Matrix로 돌아가기</a>`}${h.next?`<a class="action primary" href="?hub=${h.next}">${h.nextLabel}</a>`:`<a class="action primary" href="../index.html">Matrix로 돌아가기</a>`}</div>`}
function renderPlaceholder(h){return `<section class="card placeholder"><h2>${h.title}</h2><p>${h.subtitle}</p><p style="margin-top:10px;font-weight:900;color:#236B63">아직 상세 허브 제작 전입니다.</p></section><div class="actions">${h.prev?`<a class="action secondary" href="?hub=${h.prev}">${h.prevLabel}</a>`:`<a class="action secondary" href="../index.html">← Matrix로 돌아가기</a>`}${h.next?`<a class="action primary" href="?hub=${h.next}">${h.nextLabel}</a>`:`<a class="action primary" href="../index.html">Matrix로 돌아가기</a>`}</div>`}
function renderHubList(){document.getElementById('hubList').innerHTML=Object.entries(HUBS).map(([k,h])=>`<a class="hubItem ${k===slug?'active':''}" href="?hub=${k}"><b>${h.order.replace(' · ',' ')}</b><span>${h.short} · ${h.subtitle}</span></a>`).join('')}
